name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.7.5)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.10"

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            builder-args: "--mac --arm64"
            artifact-pattern: |
              apps/electron/release/*arm64*.dmg
              apps/electron/release/*arm64*.zip
              apps/electron/release/*arm64*.zip.blockmap
              apps/electron/release/latest-mac*.yml
            artifact-name: release-macos-arm64
          - os: macos-latest
            platform: darwin
            arch: x64
            builder-args: "--mac --x64"
            artifact-pattern: |
              apps/electron/release/*x64*.dmg
              apps/electron/release/*x64*.zip
              apps/electron/release/*x64*.zip.blockmap
              apps/electron/release/latest-mac*.yml
            artifact-name: release-macos-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            builder-args: "--linux"
            artifact-pattern: |
              apps/electron/release/*.AppImage
              apps/electron/release/latest-linux*.yml
            artifact-name: release-linux
          - os: windows-latest
            platform: win32
            arch: x64
            builder-args: "--win"
            artifact-pattern: |
              apps/electron/release/*.exe
              apps/electron/release/*.exe.blockmap
              apps/electron/release/latest*.yml
            artifact-name: release-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Electron bundles
        run: bun run electron:build

      - name: Prepare vendor binaries (Bun, uv, SDK, MCP servers)
        run: bun run scripts/ci-prepare-vendor.ts --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Package Electron app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: cd apps/electron && npx electron-builder --config electron-builder.yml ${{ matrix.builder-args }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Merge macOS update manifests
        run: |
          # Both arm64 and x64 builds produce latest-mac.yml with their own arch files.
          # Merge them into one manifest so the auto-updater serves both architectures,
          # then remove the duplicate to prevent 404 when the release action tries to
          # delete the same asset name twice.
          ARM64_YML=$(ls artifacts/release-macos-arm64/latest-mac*.yml 2>/dev/null | head -1)
          X64_YML=$(ls artifacts/release-macos-x64/latest-mac*.yml 2>/dev/null | head -1)
          if [ -n "$ARM64_YML" ] && [ -n "$X64_YML" ]; then
            node - "$ARM64_YML" "$X64_YML" <<'NODEJS'
          const fs = require("fs");
          const [arm64Path, x64Path] = process.argv.slice(2);

          // electron-builder latest-mac.yml is simple enough to parse line-by-line
          // but we use a minimal YAML-subset parser for the files array
          function parseLatestYml(text) {
            const obj = {};
            const files = [];
            let inFiles = false, current = null;
            for (const line of text.split("\n")) {
              if (line.startsWith("files:")) { inFiles = true; continue; }
              if (inFiles) {
                if (line.match(/^  - /)) {
                  if (current) files.push(current);
                  current = {};
                }
                const m = line.match(/^  (?:- )?(\w+):\s*(.+)/);
                if (m && current) current[m[1]] = m[2];
                if (!line.startsWith("  ") && line.trim() !== "") {
                  if (current) files.push(current);
                  inFiles = false; current = null;
                }
              }
              if (!inFiles) {
                const m = line.match(/^(\w+):\s*(.+)/);
                if (m) obj[m[1]] = m[2];
              }
            }
            if (current) files.push(current);
            obj.files = files;
            return obj;
          }

          function toYml(obj) {
            let out = `version: ${obj.version}\n`;
            out += "files:\n";
            for (const f of obj.files) {
              out += `  - url: ${f.url}\n`;
              out += `    sha512: ${f.sha512}\n`;
              out += `    size: ${f.size}\n`;
            }
            out += `path: ${obj.path}\n`;
            out += `sha512: ${obj.sha512}\n`;
            out += `releaseDate: ${obj.releaseDate}\n`;
            return out;
          }

          const arm64 = parseLatestYml(fs.readFileSync(arm64Path, "utf8"));
          const x64 = parseLatestYml(fs.readFileSync(x64Path, "utf8"));

          const seen = new Set(arm64.files.map(f => f.url));
          for (const f of x64.files) {
            if (!seen.has(f.url)) arm64.files.push(f);
          }

          fs.writeFileSync(arm64Path, toYml(arm64));
          console.log("✅ Merged macOS update manifests");
          NODEJS
            rm -f "$X64_YML"
          else
            echo "⚠️ Could not find both macOS manifests, skipping merge"
          fi

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/release-macos-arm64/*
            artifacts/release-macos-x64/*
            artifacts/release-linux/*
            artifacts/release-windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
